<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP 查询日志 · 天机阁</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=20261004" />
  <script src="/floating-panels.js?v=20261009-ui-qa"></script>
    <script src="/desktop-appearance.js?v=20261010-appearance-gallery-r3"></script>
    <script src="/theme.js?v=20261010-desktop-appearance"></script><link rel="stylesheet" href="/style.css?v=20261009-boundaries" />
  <style>
    .query-log { padding: 16px; border-bottom: 1px solid var(--border); }
    .query-log summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .query-log summary strong { flex: 1; }
    .query-log pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
    .query-log .error { color: #ef6b73; }
    #logRows { overflow: auto; max-height: 70vh; }
    #logEmpty { padding: 24px; }
  </style>
</head>
<body>
  <header><div class="brand"><img class="logo" src="/favicon.png?v=20261004" alt="天机阁" /><div><strong>天机阁</strong><small>MCP 查询日志</small></div></div><div class="header-actions"><button id="logTheme">切换主题</button><a href="/">返回工作台 ↗</a></div></header>
  <main class="history-main">
    <section class="policy-bar"><div><span class="eyebrow">开发者审计</span><strong>Agent 查询记录</strong><p class="muted">实时显示最近 100 条调用。展开查看条件与请求 ID，敏感值显示长度及摘要。</p></div><span id="logConnection" role="status">连接中…</span></section>
    <section class="history-panel">
      <div class="toolbar"><input id="logSearch" type="search" placeholder="工具名、会话或请求 ID…" aria-label="筛选查询日志" /><select id="logSource" aria-label="日志来源"><option value="">全部来源</option><option value="mcp">MCP</option><option value="analysis_api">分析 API</option></select><select id="logStatus" aria-label="调用状态"><option value="">全部状态</option><option value="ok">成功</option><option value="error">失败</option></select><button id="logPause">暂停更新</button><span id="logCount" class="muted"></span></div>
      <div id="logRows"></div><p id="logEmpty" class="muted" hidden>暂无查询日志。Agent 调用 MCP 工具后会自动显示。</p>
    </section>
    <p class="muted">日志文件：data/logs/mcp.jsonl · 页面关闭或隐藏后停止订阅，重新打开会补齐最近记录。</p>
  </main>
  <script src="/mcp-logs.js?v=20261009-appearance"></script>
  <script src="/table-resizer.js?v=20261004-review1"></script>
  <script src="/appearance-background.js?v=20261010-appearance-gallery-r3"></script>
  <script>initAppearanceBackground();</script>
</body>
</html>
